{{- if .Values.vault.alertRules.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: {{ include "vault.fullname" . }}
  {{- with .Values.vault.alertRules.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "vault.fullname" . }}-raft
spec:
  groups:
  - name: vault-raft
    rules:
    - alert: VaultMissingRaftNode
      expr: vault_raft_peers < 3
      for: 30s
      labels:
        severity: critical
        responsible: cloudsre
        sort_by_value: ascending
        send_to_automata: "false"
        send_to_jira: "false"
        send_to_duty_chats: "false"
      annotations:
        summary: Vault Missing Raft Node 
        description: "Numbers of vault raft peers should be 3, in order to preserve quorum."
        details: "{% raw %}cluster {{`{{`}} $labels.cluster {{`}}`}}{% endraw %}"
    - alert: VaultNoLeader
      expr: vault_raft_state_leader != 1
      for: 30s
      labels:
        severity: critical
        responsible: cloudsre
        sort_by_value: ascending
        send_to_automata: "false"
        send_to_jira: "false"
        send_to_duty_chats: "false"
      annotations:
        summary: Vault Missing Raft Leader
        description: "Vault raft has no leader"
        details: "{% raw %}cluster {{`{{`}} $labels.cluster {{`}}`}}{% endraw %}"
{{- end }}
