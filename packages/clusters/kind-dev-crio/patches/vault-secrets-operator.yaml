---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: vault-secrets-operator
    namespace: vault-secrets-operator
  releaseName: vault-secrets-operator
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    telemetry:
      serviceMonitor:
        enabled: true
